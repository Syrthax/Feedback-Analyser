services:
  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /data
      KAGGLEHUB_CACHE: /data/raw/kagglehub
      FRONTEND_DIR: /frontend
    volumes:
      - ./backend:/app
      - ./data:/data
      - ./frontend:/frontend:ro
    ports:
      - "8000:8000"
